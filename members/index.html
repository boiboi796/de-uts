<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Members | De Ultimate Steppers</title>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <link rel="apple-touch-icon" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #0a0a0c;
            --card: #131316;
            --line: #27272d;
            --gold: #ff6b3d;
            --ember: #ff6b3d;
            --bone: #f5f5f5;
            --mute: #9a9aa3
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: var(--ink);
            color: var(--bone);
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.6
        }

        #members {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(48px, 8vw, 96px) 20px
        }

        .head {
            max-width: 640px;
            margin-bottom: 36px
        }

        .head h2 {
            font-family: Syne, sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 6vw, 3.6rem);
            line-height: 1.05;
            letter-spacing: -.02em
        }

        .head p {
            color: var(--mute);
            margin-top: 14px
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 32px
        }

        .filters button {
            background: none;
            border: 1px solid var(--line);
            color: var(--mute);
            font: inherit;
            font-size: .85rem;
            padding: 6px 14px;
            border-radius: 99px;
            cursor: pointer;
            transition: .2s
        }

        .filters button:hover {
            border-color: var(--gold);
            color: var(--bone)
        }

        .filters button.on {
            background: var(--bone);
            border-color: var(--bone);
            color: var(--ink);
            font-weight: 700
        }

        .filters button:focus-visible,
        .soc a:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px
        }

        .m {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .m[hidden] {
            display: none
        }

        .ph {
            position: relative;
            aspect-ratio: 4/5;
            background: #1a1a20;
            overflow: hidden
        }

        .ph img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform .5s
        }

        .m:hover .ph img {
            transform: scale(1.04)
        }

        .ph::after {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 55%;
            background: linear-gradient(transparent, rgba(10, 10, 12, .92))
        }

        .ph .ini {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-family: Syne, sans-serif;
            font-weight: 800;
            font-size: 4rem;
            color: #fff;
            background: linear-gradient(160deg, #4a2d5a, #5a2f26)
        }

        .ph h3 {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 14px;
            z-index: 1;
            font-family: Syne, sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            line-height: 1.1;
            letter-spacing: -.01em
        }

        .bd {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1
        }

        .fn {
            color: var(--mute);
            font-size: .85rem
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .tags span {
            font-size: .74rem;
            padding: 3px 10px;
            border-radius: 99px;
            background: #25160f;
            color: var(--gold)
        }

        .bio {
            font-size: .9rem;
            color: #b4b4bc;
            flex: 1;
            white-space: pre-line
        }

        .soc {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 40px
        }

        .soc a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 12px;
            border-radius: 99px;
            border: 1px solid var(--line);
            color: var(--bone);
            text-decoration: none;
            font-size: .85rem;
            font-weight: 700;
            transition: .2s
        }

        .soc a:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: #fff
        }

        .soc svg {
            width: 16px;
            height: 16px;
            fill: currentColor
        }

        .soc em {
            color: var(--mute);
            font-size: .82rem;
            font-style: normal;
            align-self: center
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <section id="members">
        <div class="head">
            <h2>Meet the Steppers</h2>
            <p>The dancers behind De Ultimate Steppers. Tap a name's socials to follow them and catch their moves.</p>
        </div>
        <div class="filters" id="fl"></div>
        <div class="grid" id="gr"></div>
    </section>
    <script>
        const M = [
            { n: "Abiodun Samuel", f: "Abiodun Samuel Oluwatobi", d: [], b: "Lead Web Developer and Tech Coordinator for De Ultimate Steppers.", p: "", s: { li: "abiodun-samuel-oluwatobi-409489320/" } },
            { n: "Mosunmola", f: "Olasunkanmi Elizabeth", d: ["Contemporary", "Pop Dance"], b: "A creative soul who loves art, music and learning new things. Currently learning Korean thanks to K-pop, and always up for something outside her comfort zone.", p: "12_WT8ZeAGSlTlOGwuk_kMPm_WR_0r4cE", s: { tt: "sunmolamii665" } },
            { n: "Cocona Wora", f: "Adebisi Favour Oluwanifemi", d: ["Contemporary", "Afro-Fusion", "Cultural"], b: "A thespian who brings stage presence to every move, flowing between contemporary, Afro-fusion and cultural dance.", p: "1A16dKzkUEvemMMoLL2lRkv3VDavheXwj", s: { tt: "artprincess0" } },
            { n: "Iwara", f: "Iwara Benedict Jesam", d: ["Contemporary", "Afro-Fusion", "Salsa", "Cultural"], b: "A proud thespian with real range, from contemporary, Afro-fusion and salsa to Yoruba, Igbo, Zulu and Badagry cultural dances.", p: "1HuRJI8dFg9Ef0VKz4-XznhWxzczTWhoJ", s: { tt: "benjessica123" } },
            { n: "Magnolia", f: "Princess Chuks", d: ["Contemporary", "Afro-Fusion"], b: "Creative, playful and a little crazy on the inside, and she brings that energy to contemporary and Afro-fusion.", p: "1yFQ8TEG8NpdnWShBmrOLQVNIW0woeA5E", s: { tt: "Sheisprincess_xoxo" } },
            { n: "Stephanie Blaze", f: "Agwaniru Stephanie Chiamaka", d: ["Contemporary", "Afro-Fusion", "Pop Dance", "Street Dance", "Ballet", "Salsa", "Robotics", "Krump"], b: "Dynamic and versatile, moving across eight styles from ballet and salsa to robotics and krump.", p: "1KwqgmHTkACER4fxl5-jGvVh2XjW59Vfp", s: { tt: "stephaniedaniiels", ig: "_stephaniedaniiels_" } },
            { n: "Priime", f: "Promise Sunday", d: ["Contemporary", "Afro-Fusion", "Pop Dance", "Ballet", "Salsa", "Robotics", "Krump", "B-boy"], b: "A B-boy with serious range, switching between contemporary, Afro-fusion, pop, ballet, salsa, robotics and krump.", p: "1-9Qc_KILVwNCWwMncpyjsXidQDj2aFHz", s: { tt: "Iamppriime" } },
            { n: "Just Love", f: "Damatie Love", d: ["Afro-Fusion", "Ballet", "Salsa"], b: "A dancer and a singer, bringing musicality to Afro-fusion, ballet and salsa.", p: "1GCs2dmaZLnvL3AfinWfA-ytN_UMIo2EM", s: { tt: "Just_love274" } },
            { n: "Precious", f: "Onyebuchi Precious Chiamaka", d: ["Contemporary", "Afro-Fusion"], b: "A Stepper with a love for contemporary and Afro-fusion, and a presence that stands out on any floor.", p: "17AHLUoepV7VUET6jl68tiRgBBfxn7bm5", s: { tt: "prezzygold58" } },
            { n: "Dance Engine", f: "", d: ["Contemporary", "Afro-Fusion", "Pop Dance", "Street Dance", "Salsa", "Robotics", "Krump", "B-boy"], b: "A very energetic and smooth dancer who adapts to any style, and gains serious height when dancing or jumping.", p: "1qvnEbaQeU1Mgt_YIZhmjAwJws2auUshv", s: { tt: "dance__engine", ig: "dance_engine_", yt: "danceengine" } }
        ];
        const I = { yt: ["YouTube", "https://www.youtube.com/@", "M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.800 19 12 19 12 19s6.200 0 7.800-.4a2.500 2.500 0 0 0 1.800-1.800C22 15.200 22 12 22 12s0-3.200-.4-4.800zM10 15V9l5.200 3L10 15z"], li: ["LinkedIn", "https://www.linkedin.com/in/", "M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3V9.5zm7 0h3.8v1.6h.1c.5-1 1.8-1.9 3.7-1.9 4 0 4.7 2.6 4.7 6V21h-4v-5c0-1.200 0-2.800-1.700-2.800S14 14.100 14 15.900V21h-4V9.5z"], tt: ["TikTok", "https://www.tiktok.com/@", "M19.6 6.7a4.8 4.8 0 0 1-3.8-4.2h-3.4v13.6a2.9 2.9 0 1 1-2-2.8V9.8a6.3 6.3 0 1 0 5.4 6.3V9.5a8.1 8.1 0 0 0 4.7 1.5V7.6a4.8 4.8 0 0 1-.9-.9z"], ig: ["Instagram", "https://www.instagram.com/", "M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm5.500-4a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"] };
        const gr = document.getElementById("gr"), fl = document.getElementById("fl");
        const ini = n => n.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
        M.forEach(m => {
            const c = document.createElement("article");
            c.className = "m";
            c.dataset.d = m.d.join("|");
            const ph = document.createElement("div");
            ph.className = "ph";
            const fb = () => { ph.innerHTML = ""; const x = document.createElement("div"); x.className = "ini"; x.textContent = ini(m.n); ph.append(x, h) };
            const h = document.createElement("h3");
            h.textContent = m.n;
            if (m.p) {
                const im = new Image();
                im.src = "https://drive.google.com/thumbnail?id=" + m.p + "&sz=w900";
                im.alt = m.n + ", member of De Ultimate Steppers";
                im.loading = "lazy";
                im.referrerPolicy = "no-referrer";
                im.onerror = fb;
                ph.append(im, h);
            } else fb();
            const bd = document.createElement("div");
            bd.className = "bd";
            if (m.f) { const f = document.createElement("div"); f.className = "fn"; f.textContent = m.f; bd.append(f) }
            if (m.d.length) { const t = document.createElement("div"); t.className = "tags"; m.d.forEach(x => { const s = document.createElement("span"); s.textContent = x; t.append(s) }); bd.append(t) }
            const b = document.createElement("p");
            b.className = "bio";
            b.textContent = m.b || "Profile coming soon.";
            bd.append(b);
            const so = document.createElement("div");
            so.className = "soc";
            const ks = Object.keys(m.s);
            ks.forEach(k => {
                const a = document.createElement("a");
                a.href = I[k][1] + m.s[k];
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.setAttribute("aria-label", m.n + " on " + I[k][0]);
                a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + I[k][2] + '"/></svg>' + I[k][0];
                so.append(a);
            });
            if (!ks.length) { const e = document.createElement("em"); e.textContent = "Socials coming soon"; so.append(e) }
            bd.append(so);
            c.append(ph, bd);
            gr.append(c);
        });
        const all = [...new Set(M.flatMap(m => m.d))];
        ["All", ...all].forEach((x, i) => {
            const b = document.createElement("button");
            b.textContent = x;
            if (!i) b.className = "on";
            b.onclick = () => {
                fl.querySelectorAll("button").forEach(y => y.classList.toggle("on", y === b));
                gr.querySelectorAll(".m").forEach(c => { c.hidden = i && !c.dataset.d.split("|").includes(x) });
            };
            fl.append(b);
        });
    </script>
</body>

</html>
