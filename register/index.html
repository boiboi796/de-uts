<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon | De Ultimate Steppers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      min-height: 100vh;
      background: #0a0a0c;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden
    }

    main {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(80vw, 520px);
      aspect-ratio: 1;
      border: 2px solid #ff6b3d;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.4);
      opacity: 0;
      animation: pulse 4s ease-out infinite;
      pointer-events: none
    }

    .ring.b {
      animation-delay: 2s
    }

    h1 {
      position: relative;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(2.6rem, 12vw, 6.5rem);
      line-height: 1.05;
      letter-spacing: -.02em
    }

    h1 span {
      display: inline-block;
      animation: wave 1.8s ease-in-out infinite;
      animation-delay: calc(var(--i)*.08s)
    }

    .tg {
      position: relative;
      font-family: Syne, sans-serif;
      font-weight: 700;
      color: #ff6b3d;
      font-size: clamp(1rem, 3.5vw, 1.3rem)
    }

    .sub {
      position: relative;
      color: #9a9aa3;
      max-width: 380px
    }

    .bk {
      position: relative;
      margin-top: 6px;
      background: #f5f5f5;
      color: #0a0a0c;
      text-decoration: none;
      font-weight: 700;
      font-size: .92rem;
      padding: 11px 24px;
      border-radius: 99px;
      transition: .2s
    }

    .bk:hover {
      background: #ff6b3d;
      color: #fff
    }

    .bk:focus-visible {
      outline: 2px solid #ff6b3d;
      outline-offset: 3px
    }

    @keyframes wave {

      0%,
      60%,
      100% {
        transform: translateY(0)
      }

      30% {
        transform: translateY(-.22em);
        color: #ff6b3d
      }
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(.4);
        opacity: .6
      }

      100% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 0
      }
    }

    @media (prefers-reduced-motion:reduce) {

      h1 span,
      .ring {
        animation: none
      }

      .ring {
        opacity: .15;
        transform: translate(-50%, -50%)
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="ring"></div>
    <div class="ring b"></div>
    <h1 id="h" aria-label="Coming Soon">Coming Soon</h1>
    <p class="tg">Move. Feel. Become.</p>
    <p class="sub">We're not taking new members currently, please check back later.</p>
    <p class="sub">Contact us through the official channels</p>

    <a class="bk" href="../index.html">Back to home</a>
  </main>
  <script>
    const h = document.getElementById("h");
    h.innerHTML = [..."Coming Soon"].map((c, i) => '<span aria-hidden="true" style="--i:' + i + '">' + (c === " " ? "&nbsp;" : c) + "</span>").join("");
  </script>
</body>

</html>
